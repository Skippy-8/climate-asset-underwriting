[project]
name = "climate-asset-underwriting"
version = "0.1.0"
description = "Illustrative underwriting and monitoring models for a multifamily decarbonization retrofit and a solar + storage project financing, built on public benchmarks."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sneh Patel" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5", "formulas>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cau"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cau"]
