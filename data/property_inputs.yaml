  - {key: Share_DHW_Gas, label: "End-use share: domestic hot water (gas, central)", value: 0.22, unit: "% of site energy", tag: Estimated, source: recs_2020}
  - {key: Share_Common_Elec, label: "End-use share: common-area electricity (owner-paid)", value: 0.12, unit: "% of site energy", tag: Estimated, source: analyst}
  - {key: Share_Tenant_Elec, label: "End-use share: in-unit electricity (tenant-paid)", value: 0.38, unit: "% of site energy", tag: Estimated, source: recs_2020}
  - {key: Elec_Price, label: Electricity price (commercial, DC, 2024), value: 0.1707, unit: $/kWh, tag: Sourced, source: eia_epa_2_10}
  - {key: Gas_Price_Mcf, label: Natural gas price (commercial, DC, 2025), value: 14.36, unit: $/Mcf, tag: Sourced, source: eia_ng_dc}
  - {key: Gas_MMBtu_Per_Mcf, label: Natural gas heat content, value: 1.026, unit: MMBtu/Mcf, tag: Sourced, source: epa_ef_hub_2025}

Retrofit:
  - {key: Boiler_Eff, label: Existing boiler seasonal efficiency, value: 0.80, unit: ratio, tag: Estimated, source: analyst}
  - {key: COP_Heat, label: Heat pump seasonal COP, space heating, value: 2.6, unit: ratio, tag: Estimated, source: analyst, note: "Air-to-water, mixed-humid climate"}
  - {key: COP_DHW, label: Heat pump seasonal COP, hot water, value: 2.8, unit: ratio, tag: Estimated, source: analyst}
  - {key: Envelope_Heat_Reduction, label: Heating load reduction from envelope work, value: 0.10, unit: "% of heating load", tag: Estimated, source: analyst}
  - {key: LED_Savings, label: Common-area electricity saved by LEDs and controls, value: 0.15, unit: "% of common kWh", tag: Estimated, source: analyst}
  - {key: Solar_kWdc, label: Rooftop solar size, value: 180, unit: kWdc, tag: Illustrative, source: asset, note: "~15,000 sf of usable roof"}
  - {key: Solar_Yield, label: Solar specific yield, value: 1317.7, unit: kWh/kWdc/yr, tag: Sourced, source: pvwatts_v8}
  - {key: Solar_Capex_Per_W, label: Rooftop solar installed cost, value: 1.78, unit: $/Wdc, tag: Sourced, source: atb_2024b_commercial_pv}
  - {key: Solar_ITC, label: Solar investment tax credit monetised, value: 0.30, unit: "% of solar capex", tag: Illustrative, source: analyst, note: "Eligibility depends on post-2025 federal rules; stressed to 0"}
  - {key: HP_Capex_Per_Unit, label: Central heat pump plant (heat + hot water), value: 10000, unit: $/unit, tag: Estimated, source: analyst, note: "Wide uncertainty; the main retrofit sensitivity"}
  - {key: Envelope_Capex_Per_SF, label: Envelope and air sealing, value: 1.50, unit: $/sf GFA, tag: Estimated, source: analyst}
  - {key: LED_Capex_Per_Unit, label: LEDs and controls, value: 300, unit: $/unit, tag: Estimated, source: analyst}
  - {key: Measure_Life, label: Measure life for $/tCO2e, value: 20, unit: years, tag: Estimated, source: analyst}
  - {key: Gas_Retained_Share, label: Share of baseline gas kept after electrification, value: 0.0, unit: "%", tag: Illustrative, source: asset, note: "0 = heat and hot water fully electrified"}

Emissions:
  - {key: Grid_CO2e_lb_MWh, label: Grid emission rate (eGRID2022 RFCE, total output), value: 660.3, unit: lb CO2e/MWh, tag: Sourced, source: egrid2022, note: "Held flat; grid decarbonisation not modelled"}
