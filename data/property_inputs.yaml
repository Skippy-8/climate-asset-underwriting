# Inputs for the illustrative 150-unit multifamily acquisition + decarbonization retrofit (Washington, DC).
# Every value is tagged Sourced / Estimated / Illustrative / Definition and cites an id in data/sources.yaml.
# Fractions are decimals (0.05 = 5%). Money is nominal US$.

Rent roll:
  - {key: Units_Studio, label: Studio units, value: 20, unit: units, tag: Illustrative, source: asset}
  - {key: Units_1BR, label: One-bedroom units, value: 80, unit: units, tag: Illustrative, source: asset}
  - {key: Units_2BR, label: Two-bedroom units, value: 45, unit: units, tag: Illustrative, source: asset}
  - {key: Units_3BR, label: Three-bedroom units, value: 5, unit: units, tag: Illustrative, source: asset}
  - {key: SF_Studio, label: Studio average size, value: 520, unit: sf, tag: Illustrative, source: asset}
  - {key: SF_1BR, label: One-bedroom average size, value: 720, unit: sf, tag: Illustrative, source: asset}
  - {key: SF_2BR, label: Two-bedroom average size, value: 1000, unit: sf, tag: Illustrative, source: asset}
  - {key: SF_3BR, label: Three-bedroom average size, value: 1250, unit: sf, tag: Illustrative, source: asset}
  - {key: Rent_Studio, label: Studio in-place rent, value: 1750, unit: $/month, tag: Estimated, source: hud_safmr_fy2026, note: "Set inside the FY2026 DC SAFMR range"}
  - {key: Rent_1BR, label: One-bedroom in-place rent, value: 2050, unit: $/month, tag: Estimated, source: hud_safmr_fy2026}
  - {key: Rent_2BR, label: Two-bedroom in-place rent, value: 2600, unit: $/month, tag: Estimated, source: hud_safmr_fy2026, note: "DC ZIP 2BR SAFMRs run $2,030-$2,620"}
  - {key: Rent_3BR, label: Three-bedroom in-place rent, value: 3150, unit: $/month, tag: Estimated, source: hud_safmr_fy2026}
  - {key: GFA, label: Gross floor area (for EUI), value: 150000, unit: sf, tag: Illustrative, source: asset, note: "Net rentable ~119k sf; ~80% efficiency"}

Revenue and growth:
  - {key: Vacancy_Rate, label: Vacancy and credit loss, value: 0.05, unit: "% of GPR", tag: Estimated, source: analyst}
  - {key: Other_Income_Per_Unit, label: Other income (parking, fees), value: 1200, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Rent_Growth, label: Rent growth, value: 0.03, unit: "%/yr", tag: Estimated, source: analyst}
  - {key: Other_Income_Growth, label: Other income growth, value: 0.025, unit: "%/yr", tag: Estimated, source: analyst}
  - {key: Expense_Growth, label: Operating expense growth, value: 0.03, unit: "%/yr", tag: Estimated, source: analyst}
  - {key: Tax_Growth, label: Assessed value growth, value: 0.03, unit: "%/yr", tag: Estimated, source: analyst}
  - {key: Utility_Price_Growth, label: Utility price growth (gas and power), value: 0.025, unit: "%/yr", tag: Estimated, source: analyst}

Operating expenses:
  - {key: Assessed_Value_Per_Unit, label: Assessed value, value: 280000, unit: $/unit, tag: Estimated, source: analyst, note: "Kept independent of price so taxes do not loop through the purchase price"}
  - {key: Tax_Rate, label: Real property tax rate (Class 1A), value: 0.0085, unit: "% of assessed", tag: Sourced, source: dc_otr_tax}
  - {key: Insurance_Per_Unit, label: Insurance, value: 900, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Water_Sewer_Per_Unit, label: Water and sewer, value: 750, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Repairs_Per_Unit, label: Repairs and maintenance, value: 1100, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Payroll_Per_Unit, label: Payroll, value: 1800, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Admin_Per_Unit, label: G&A and marketing, value: 500, unit: $/unit/yr, tag: Estimated, source: analyst}
  - {key: Mgmt_Fee_Pct, label: Management fee, value: 0.03, unit: "% of EGI", tag: Estimated, source: analyst}
  - {key: Reserve_Per_Unit, label: Replacement reserves, value: 300, unit: $/unit/yr, tag: Estimated, source: analyst, note: "Agency-style underwriting level"}
  - {key: Boiler_Replace_Cost, label: Boiler replacement (status quo only), value: 450000, unit: $, tag: Estimated, source: analyst, note: "Avoided if the plant is electrified"}
  - {key: Boiler_Replace_Year, label: Boiler replacement year, value: 3, unit: year, tag: Illustrative, source: asset}

Energy baseline:
  - {key: Site_EUI_Base, label: Baseline site EUI, value: 59.6, unit: kBtu/sf/yr, tag: Sourced, source: estar_median, note: "Building assumed at the national multifamily median"}
