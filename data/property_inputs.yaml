  - {key: NG_CH4_g_MMBtu, label: Natural gas CH4 factor, value: 1.0, unit: g/MMBtu, tag: Sourced, source: epa_ef_hub_2025}
  - {key: NG_N2O_g_MMBtu, label: Natural gas N2O factor, value: 0.10, unit: g/MMBtu, tag: Sourced, source: epa_ef_hub_2025}
  - {key: GWP_CH4, label: Global warming potential, CH4 (AR5), value: 28, unit: ratio, tag: Sourced, source: epa_ef_hub_2025}
  - {key: GWP_N2O, label: Global warming potential, N2O (AR5), value: 265, unit: ratio, tag: Sourced, source: epa_ef_hub_2025}
